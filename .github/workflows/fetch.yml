# .github/workflows/fetch.yml
name: fetch-and-run

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Smoke test (mock mode)
        run: python run_pipeline.py --mock --query "test" --timeframe 24h
      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
        run: python run_pipeline.py
      - name: Persist SQLite DB
        run: |
          git config user.name "midya-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f '*.db' '*.sqlite3' data/ 2>/dev/null || true
          git commit -m "chore: update db $(date -u +'%F %T UTC')" || echo "no changes"
          git push